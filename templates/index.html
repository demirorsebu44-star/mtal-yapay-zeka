<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTAL Yapay Zekâ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; height: 100vh; }
        .chat-container { width: 100%; max-width: 800px; margin: auto; display: flex; flex-direction: column; height: 90vh; background: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .chat-header { background: #334155; padding: 20px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #475569; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; word-break: break-word; }
        .user-message { background: #2563eb; color: #fff; align-self: flex-end; }
        .bot-message { background: #334155; color: #f8fafc; align-self: flex-start; }
        .input-area { display: flex; padding: 15px; background: #0f172a; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; outline: none; }
        button { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">🤖 MTAL Yapay Zekâ Asistanı</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">Selam! Sana nasıl yardımcı olabilirim?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Mesajını yaz..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            chatBox.innerHTML += `<div class="message user-message">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot-message';
            loadingDiv.innerText = 'Düşünüyor...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const formData = new FormData();
                formData.append('mesaj', text);

                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                loadingDiv.innerText = data.cevap || data.error || 'Bir hata oluştu.';
            } catch (err) {
                loadingDiv.innerText = 'Sunucuya bağlanılamadı!';
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
